<head>

<title>وصلني بطريقك ⚡ كابتن برو</title>
<!--

  إن كنت ترفع ملفًا واحدًا، ارفع «كابتن.html» مباشرة ولا تحتاج هذا الملف.

<meta http-equiv="refresh" content="0; url=%D9%83%D8%A7%D8%A8%D8%AA%D9%86.html">
<link rel="canonical" href="كابتن.html">
<style>
  html,body{height:100%;margin:0;background:#05070f;color:#f4f7fb;
    font-family:'Cairo','Segoe UI',system-ui,sans-serif;display:grid;place-items:center;text-align:center}
  .box{padding:28px}
  .logo{width:88px;height:88px;border-radius:26px;margin:0 auto 16px;display:grid;place-items:center;font-size:42px;
    background:linear-gradient(135deg,#60a5fa,#2563eb 45%,#7c3aed);box-shadow:0 14px 40px rgba(37,99,235,.45)}
  h1{font-size:18px;margin:0 0 6px}
  p{color:#8d9ab2;font-size:13px;margin:0 0 18px;line-height:1.8}
  a{display:inline-block;padding:13px 22px;border-radius:16px;background:linear-gradient(135deg,#3b82f6,#1d4ed8);
    color:#fff;text-decoration:none;font-weight:900;font-size:14px;box-shadow:0 10px 26px rgba(37,99,235,.4)}
  .bar{width:150px;height:4px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden;margin:18px auto 0}
  .bar i{display:block;height:100%;width:35%;border-radius:99px;background:linear-gradient(90deg,#60a5fa,#a855f7);
    animation:go 1.1s cubic-bezier(.4,0,.2,1) infinite}
  @keyframes go{0%{transform:translateX(120%)}100%{transform:translateX(-320%)}}
</style>
<script>
  // تحويل فوري (احتياطًا إن تجاهل المتصفح وسم meta refresh)
  location.replace(decodeURIComponent('%D9%83%D8%A7%D8%A8%D8%AA%D9%86.html'));
